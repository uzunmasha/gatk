name: CI tests

on:
  push:
    branches:
      - develop
      - master
    paths:
      - "**.nf"
      - "nextflow.config"
      - "nextflow_schema.json"
      - "nf-test.config"
      - "modules/**"
      - "subworkflows/**"
      - "workflows/**"
      - "conf/**"
      - "assets/**"
      - "bin/**"
      - "tests/**"
      - "**.nf-test/"
      - "!**.md"

  pull_request:
    paths:
      - "**.nf"
      - "nextflow.config"
      - "nextflow_schema.json"
      - "nf-test.config"
      - "modules/**"
      - "subworkflows/**"
      - "workflows/**"
      - "conf/**"
      - "assets/**"
      - "bin/**"
      - "tests/**"
      - "**.nf-test/"
      - ".github/workflows/**"
      - "!**.md"
  release:
    types: [published]
  workflow_dispatch:

env:
  NXF_ANSI_LOG: false
  NXF_SYNTAX_PARSER: v2

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: "Run pipeline with test data (${{ matrix.NXF_VER }})"

    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        NXF_VER:
          - "26.04.0"
          - "latest"

        profile:
          - "docker,ci"

        test_name:
          - "test"

    steps:
      - name: Setup actions bin dir
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs

      - name: Checkout pipeline code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Nextflow ${{ matrix.NXF_VER }}
        run: |
          NXF_VER="${{ matrix.NXF_VER }}"

          if [ "$NXF_VER" = "latest" ]; then
            NXF_URL="https://github.com/nextflow-io/nextflow/releases/latest/download/nextflow"
          else
            NXF_URL="https://github.com/nextflow-io/nextflow/releases/download/v${NXF_VER}/nextflow"
          fi

          curl -fsSL "$NXF_URL" -o "$RUNNER_TEMP/bin/nextflow"
          chmod +x "$RUNNER_TEMP/bin/nextflow"
          nextflow -version

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t gatk-pipeline:v1.0.0 \
            -f docker/Dockerfile .

      - name: "Run pipeline with test data ${{ matrix.NXF_VER }} | ${{ matrix.test_name }} | ${{ matrix.profile }}"
        run: |
          nextflow run ${GITHUB_WORKSPACE} -profile ${{ matrix.test_name }},${{ matrix.profile }}
